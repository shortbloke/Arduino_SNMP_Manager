name: Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned linters
        run: |
          python -m pip install -r requirements-lint.txt
          python scripts/install_lint_tools.py "$RUNNER_TEMP/lint-tools"
          echo "$RUNNER_TEMP/lint-tools" >> "$GITHUB_PATH"
      - name: Check workflows and embedded shell
        run: actionlint -shellcheck shellcheck
      - name: Check Python
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Check Arduino library packaging
        run: python scripts/lint_arduino.py
