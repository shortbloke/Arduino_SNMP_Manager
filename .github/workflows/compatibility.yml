name: Library compatibility
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: |
          mapfile -d '' markdown_files < <(git ls-files -z '*.md')
          npx --yes markdownlint-cli@0.49.1 "${markdown_files[@]}"
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19 clang-format==19.1.7
      - run: clang-format --dry-run --Werror src/*.h src/*.cpp tests/native/*.cpp tests/native/cases/*.cpp tests/native/support/*.h tests/native/support/*.cpp tests/platformio/test_snmp/*.cpp tests/native/stubs/*.h tests/native/stubs/*.cpp tests/native/compatibility/*.cpp tests/native/lifecycle/*.cpp tests/embedded/src/*.cpp tests/hardware/src/*.cpp tests/interop/*.cpp examples/*/*.h examples/*/*.ino
      - run: python3 scripts/release.py check --allow-unreleased
      - run: python3 -m unittest discover -s tests/release
      - run: make -C tests/native check
      - run: make -C tests/native BUILD=build-sanitize CXXFLAGS='-std=c++11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all' check
      - run: make -C tests/native leaks
      - run: pio test -e native
      - run: python3 tests/hardware/test_check_log.py
      - run: python3 tests/hardware/test_burst_test.py
  embedded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp8266, esp32, esp32c3, nano_esp32, esp32_custom]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('tests/embedded/platformio.ini') }}
      - run: pio run -d tests/embedded -e ${{ matrix.target }}
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [legacy, query_esp8266, query_esp32]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-examples-${{ matrix.group }}-${{ hashFiles('tests/examples/platformio.ini') }}
      - name: Compile example group
        env:
          EXAMPLE_GROUP: ${{ matrix.group }}
        run: python3 scripts/build_examples.py "$EXAMPLE_GROUP"
      - if: matrix.group == 'legacy'
        run: pio run -d tests/hardware
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: examples-${{ matrix.group }}
          path: tests/examples/.pio/build/**/firmware.bin
          retention-days: 7
          include-hidden-files: true

  wire_interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y snmp snmpd
      - run: python3 tests/interop/run.py
