name: Library compatibility
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19 clang-format==19.1.7
      - run: clang-format --dry-run --Werror src/*.h tests/native/tests.cpp tests/native/stubs/*.h tests/native/compatibility/*.cpp tests/embedded/src/*.cpp
      - run: make -C tests/native check
      - run: make -C tests/native BUILD=build-sanitize CXXFLAGS='-std=c++11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all' check
      - run: pio test -e native
  embedded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp8266, esp32, esp32c3, nano_esp32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('tests/embedded/platformio.ini') }}
      - run: pio run -d tests/embedded -e ${{ matrix.target }}
