[platformio]
default_envs = single_esp8266, single_esp32, multiple_esp8266, multiple_esp32, ethernet_esp8266, simple_read_esp8266, simple_read_esp32, multiple_devices_esp8266, multiple_devices_esp32, interface_traffic_esp8266, interface_traffic_esp32

[env]
framework = arduino
lib_deps =
    symlink://../..
build_flags =
    -Wall
    -Wextra

[env:esp8266_base]
platform = espressif8266@4.2.1
board = nodemcuv2

[env:esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev

[env:single_esp8266]
extends = env:esp8266_base
build_src_filter = +<single.cpp>

[env:single_esp32]
extends = env:esp32_base
build_src_filter = +<single.cpp>

[env:multiple_esp8266]
extends = env:esp8266_base
build_src_filter = +<multiple.cpp>

[env:multiple_esp32]
extends = env:esp32_base
build_src_filter = +<multiple.cpp>

[env:ethernet_esp8266]
extends = env:esp8266_base
build_src_filter = +<ethernet.cpp>

[env:simple_read_esp8266]
extends = env:esp8266_base
build_src_filter = +<simple_read.cpp>

[env:simple_read_esp32]
extends = env:esp32_base
build_src_filter = +<simple_read.cpp>

[env:multiple_devices_esp8266]
extends = env:esp8266_base
build_src_filter = +<multiple_devices.cpp>

[env:multiple_devices_esp32]
extends = env:esp32_base
build_src_filter = +<multiple_devices.cpp>

[env:interface_traffic_esp8266]
extends = env:esp8266_base
build_src_filter = +<interface_traffic.cpp>

[env:interface_traffic_esp32]
extends = env:esp32_base
build_src_filter = +<interface_traffic.cpp>
