[platformio]
default_envs = esp8266, esp32, d1_mini

[env]
framework = arduino
lib_deps = symlink://../..
monitor_speed = 115200

[env:esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev

[env:d1_mini]
extends = env:esp8266
board = d1_mini
