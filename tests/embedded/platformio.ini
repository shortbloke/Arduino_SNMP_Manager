[platformio]
default_envs = esp8266, esp32, esp32c3, nano_esp32

[env]
framework = arduino
build_flags =
    -I ../../src
    -DDEBUG
    -DDEBUG_BER

[env:esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev

[env:esp32c3]
extends = env:esp32
board = esp32-c3-devkitm-1

[env:nano_esp32]
extends = env:esp32
board = arduino_nano_esp32
