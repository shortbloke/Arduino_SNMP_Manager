name=SNMP Manager
version=2.0.0
author=Martin Rowan <martin@martinrowan.co.uk>
maintainer=Martin Rowan <martin@martinrowan.co.uk>
sentence=An SNMP Manager library to make SNMP requests to other SNMP enabled devices.
paragraph=A bounded SNMPv1/SNMPv2c manager for ESP8266 and ESP32 with typed queries, GETNEXT/GETBULK walks, tables, SET, and notification reception. Use 2.x for new projects. Existing 1.x sketches should select the latest 1.x release; 1.x remains maintained. Migrating to 2.x requires code changes.
category=Communication
url=https://github.com/shortbloke/Arduino_SNMP_Manager
architectures=esp8266,esp32
includes=Arduino_SNMP_Manager.h
