[platformio]
default_envs = native
test_dir = tests/platformio

[env:native]
platform = platformio/native@1.2.1
test_framework = googletest
test_build_src = yes
build_flags =
    -std=gnu++17
    -g
    -DSNMP_GOOGLETEST
    -I tests/native/stubs
    -I src

[env:native-sanitize]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O1
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
    -fno-omit-frame-pointer
